name: Build and create Windows NSIS installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      installer_name: ${{ steps.get_version.outputs.installer_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and installer name
        id: get_version
        shell: bash
        run: |
          if [ -f package.json ]; then
            version=$(grep -oP '"version"\s*:\s*"\K[^"]+' package.json || echo "0.0.0")
          else
            version="0.0.0"
          fi
          installer="oc-custom-setup-x64-$version.exe"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "installer_name=$installer" >> $GITHUB_OUTPUT
          echo "Detected version: $version"
          echo "Installer name: $installer"

      - name: Ensure Bun is installed
        shell: bash
        run: |
          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
          fi
          bun --version || true

      - name: Install dependencies & build (bun)
        shell: bash
        run: |
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install
          bun build

      - name: Prepare installer files and upload artifact
        shell: bash
        run: |
          OUTPUT_DIR="dist"
          rm -rf installer_files || true
          mkdir -p installer_files
          if [ -d "$OUTPUT_DIR" ]; then
            cp -r "$OUTPUT_DIR"/* installer_files/ || true
          else
            echo "Warning: $OUTPUT_DIR does not exist; artifact will be empty."
          fi
        # upload the installer_files directory for the windows job
      - name: Upload installer files artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer_files
          path: installer_files

  windows-installer:
    name: Windows: build NSIS installer and publish
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download installer files artifact
        uses: actions/download-artifact@v4
        with:
          name: installer_files
          path: installer_files

      - name: Install NSIS (choco)
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Create NSIS script (PowerShell template + replace)
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $installerName = '${{ needs.build.outputs.installer_name }}'
          $app = 'oc-custom'

          $template = @'
Name "__APP__ Installer"
OutFile "__INSTALLER__"
InstallDir "$PROGRAMFILES64\__APP__"
Page directory
Page instfiles
Section "Install"
  SetOutPath "$INSTDIR"
  File /r "installer_files\*"
  CreateShortCut "$SMPROGRAMS\__APP__.lnk" "$INSTDIR\__APP__.exe"
SectionEnd
'@

          $content = $template.Replace('__APP__', $app).Replace('__INSTALLER__', $installerName)
          $content | Out-File -FilePath installer.nsi -Encoding utf8

      - name: List installer_files for debug
        shell: pwsh
        run: |
          Get-ChildItem -Path installer_files -Recurse -Force | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Build installer with makensis
        shell: pwsh
        run: |
          $installerName = '${{ needs.build.outputs.installer_name }}'
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          if (-not (Test-Path $installerName)) { Write-Error "Installer not created: $installerName" } else { Write-Host "Installer created: $installerName" }

      - name: List generated files
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Force | Where-Object { $_.Length -gt 0 } | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Create GitHub Release and upload installer
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.build.outputs.version }}
          files: ${{ needs.build.outputs.installer_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_FOR_SYNC }}
